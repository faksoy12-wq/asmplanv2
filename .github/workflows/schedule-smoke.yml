name: ASMPlan PWA schedule regression
on:
  push:
    branches: [main, feature/pdf-paylasim-takvim-duzeni]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schedule-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run schedule logic tests (Node.js)
        run: node --test tests/*.cjs
